version: "3.8"

services:
  ## --------------------------- BANCO DE DADOS --------------------------- ##
  postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres_local
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_senha_local
      - POSTGRES_DB=evolution_db
    volumes:
      - ./evo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evolution_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  ## --------------------------- CACHE --------------------------- ##
  redis:
    image: redis:7-alpine
    container_name: evolution_redis_local
    restart: always
    volumes:
      - ./evo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ## --------------------------- MENSAGERIA (RABBITMQ) --------------------------- ##
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: evolution_rabbitmq_local
    restart: always
    ports:
      - "15672:15672" # Painel de controle visual do RabbitMQ (bom para estudos)
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin_senha_local
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  ## --------------------------- EVOLUTION API --------------------------- ##
  evolution_api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api_local
    restart: always
    ports:
      - "8080:8080" # Porta principal da API
    volumes:
      - ./evo_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ## Configurações Gerais
      - SERVER_URL=http://localhost:8080
      - HOST=0.0.0.0
      - AUTHENTICATION_API_KEY=chave_secreta_faculdade_123 # Use esta chave no seu Postman/n8n
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=1902
      - LANGUAGE=pt-BR

      ## Configuração do Banco de Dados
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres_senha_local@postgres:5432/evolution_db?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_local
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=true

      ## Configuração do Cache
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/2
      - CACHE_REDIS_PREFIX_KEY=evolution_local
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false

      ## Configuração do RabbitMQ
      - RABBITMQ_ENABLED=true
      - RABBITMQ_URI=amqp://admin:admin_senha_local@rabbitmq:5672
      - RABBITMQ_EXCHANGE_NAME=evolution
      - RABBITMQ_GLOBAL_ENABLED=false
      - RABBITMQ_EVENTS_QRCODE_UPDATED=true
      - RABBITMQ_EVENTS_MESSAGES_UPSERT=true
      - RABBITMQ_EVENTS_CONNECTION_UPDATE=true